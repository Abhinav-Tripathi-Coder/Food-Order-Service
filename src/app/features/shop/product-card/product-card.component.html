<!-- <p>product-card works!</p> -->


<mat-card class="product-card">
  <div class="card-content-wrapper">
    <div class="image-section">
      <img 
        *ngIf="product.image" 
        [src]="product.image" 
        [alt]="product.name"
        (error)="onImageError($event)"
      >
      <div *ngIf="!product.image" class="no-image">
        <mat-icon>restaurant</mat-icon>
      </div>
      
      <!-- Wishlist Heart Icon -->
      <button 
        mat-icon-button 
        class="wishlist-btn" 
        (click)="toggleWishlist()"
        [class.active]="isInWishlist$ | async"
        [attr.aria-label]="(isInWishlist$ | async) ? 'Remove from wishlist' : 'Add to wishlist'"
      >
        <mat-icon>{{ (isInWishlist$ | async) ? 'favorite' : 'favorite_border' }}</mat-icon>
      </button>
    </div>
    
    <div class="details-section">
      <mat-card-header>
        <mat-card-title>{{ product.name }}</mat-card-title>
        <mat-card-subtitle>₹ {{ product.price | number:'1.0-0' }}</mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <p>{{ product.description }}</p>
      </mat-card-content>

      <mat-card-actions>
        <button mat-raised-button color="primary" (click)="onAddClick()">Add to Cart</button>
      </mat-card-actions>
    </div>
  </div>
</mat-card>
