<div class="admin-dashboard">
  <h1>Admin Dashboard</h1>

  <div class="dashboard-cards">
    <mat-card class="dashboard-card" routerLink="/admin/users">
      <mat-card-header>
        <mat-icon class="card-icon">people</mat-icon>
      </mat-card-header>
      <mat-card-content>
        <h2>User Management</h2>
        <p>Manage users, roles, and permissions</p>
      </mat-card-content>
    </mat-card>

    <mat-card class="dashboard-card" routerLink="/admin/orders">
      <mat-card-header>
        <mat-icon class="card-icon">shopping_bag</mat-icon>
      </mat-card-header>
      <mat-card-content>
        <h2>Order Management</h2>
        <p>View and manage all orders</p>
      </mat-card-content>
    </mat-card>

    <mat-card class="dashboard-card">
      <mat-card-header>
        <mat-icon class="card-icon">restaurant</mat-icon>
      </mat-card-header>
      <mat-card-content>
        <h2>Products</h2>
        <p>Manage menu items and pricing</p>
      </mat-card-content>
    </mat-card>

    <mat-card class="dashboard-card">
      <mat-card-header>
        <mat-icon class="card-icon">analytics</mat-icon>
      </mat-card-header>
      <mat-card-content>
        <h2>Analytics</h2>
        <p>View sales and performance metrics</p>
      </mat-card-content>
    </mat-card>
  </div>
</div>
