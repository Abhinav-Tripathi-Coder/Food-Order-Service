<!-- <p>login works!</p> -->


<div class="login-wrapper">
  <mat-card>
    <mat-card-title>Login</mat-card-title>
    <mat-card-content>
      <form [formGroup]="f" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Username</mat-label>
          <input matInput formControlName="username" autocomplete="username" />
          <mat-error *ngIf="f.controls['username'].invalid && f.controls['username'].touched">
            Username is required.
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password" />
          <mat-error *ngIf="f.controls['password'].invalid && f.controls['password'].touched">
            Password is required.
          </mat-error>
        </mat-form-field>

        <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>

        <button mat-raised-button color="primary" class="full-width" [disabled]="loading">
          {{ loading ? 'Logging in…' : 'Login' }}
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
